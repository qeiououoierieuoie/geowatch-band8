name: GeoWatch 24/7 Auto Alert

on:
  schedule:
    # Berjalan otomatis setiap 5 menit nonstop di cloud GitHub
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol untuk memicu manual kapan saja

jobs:
  geowatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan GeoWatch & Kirim Notifikasi ke Mi Band
        run: |
          python geowatch_engine.py --lat -2.99 --lon 104.76 --ntfy geowatch_band8_active
